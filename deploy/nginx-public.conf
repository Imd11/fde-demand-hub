server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cloudsequ.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudsequ.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name cloudsequ.com;
    root /srv/cloudsequ/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cloudsequ.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudsequ.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name fde.cloudsequ.com;
    client_max_body_size 16k;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /api/requirements {
        limit_req zone=fde_submit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name cloudsequ.com fde.cloudsequ.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
