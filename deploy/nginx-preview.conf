limit_req_zone $binary_remote_addr zone=fde_submit:10m rate=5r/m;
server {
    listen 127.0.0.1:8080;
    server_name cloudsequ.com;
    root /srv/cloudsequ/current;
    index index.html;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 127.0.0.1:8081;
    server_name fde.cloudsequ.com;
    client_max_body_size 16k;
    location = /api/requirements {
        limit_req zone=fde_submit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
